title: Credential Abuse via Valid Accounts — Impossible Travel and Anomalous Logon
id: d4e7f2a1-8b3c-4d9e-b5f1-6a2c3d4e5f6a
status: experimental
description: |
    Detects abuse of valid credentials through anomalous logon patterns
    including impossible travel (same account logging in from geographically
    distant locations within a short time window), off-hours authentication,
    and logon from unusual source IPs or workstations.

    Adversaries with valid credentials are the hardest threat to detect
    because they blend with legitimate user activity. This rule focuses
    on behavioural anomalies that distinguish adversarial use of valid
    accounts from normal user behaviour.

    Detection scenarios covered:
      - Same account authenticating from two different source IPs
        within 10 minutes (impossible travel indicator)
      - Successful logon outside business hours (22:00 - 06:00)
        from an account that has never logged on outside hours before
      - Logon from a new/previously unseen source IP for the account
      - Multiple failed logons followed by a success (brute force + success)

    Commonly observed in: Business Email Compromise (BEC), credential
    stuffing attacks, insider threat scenarios, and post-phishing
    adversarial access using stolen credentials.

references:
    - https://attack.mitre.org/techniques/T1078/
    - https://attack.mitre.org/techniques/T1078/002/
    - https://attack.mitre.org/techniques/T1078/003/
    - https://github.com/charudatta-padhye/detection-query-library
author: Charudatta Padhye
date: 2025-04-30
modified: 2025-04-30
tags:
    - attack.initial_access
    - attack.t1078            # Valid Accounts
    - attack.t1078.002        # Valid Accounts: Domain Accounts
    - attack.t1078.003        # Valid Accounts: Local Accounts
    - attack.persistence
    - attack.privilege_escalation
    - attack.defense_evasion
logsource:
    category: authentication
    product: windows
    definition: |
        Requires Windows Security Event Log with the following Event IDs:
        4624 — Successful logon
        4625 — Failed logon
        4648 — Logon using explicit credentials
        4768 — Kerberos authentication ticket requested
        4776 — NTLM credential validation
        Enable: Advanced Audit Policy → Logon/Logoff → Audit Logon (Success+Failure)
detection:
    selection_successful_logon:
        EventID: 4624
        LogonType:
            - 3    # Network logon (most common for lateral movement)
            - 10   # RemoteInteractive (RDP)
            - 7    # Unlock (suspicious if from new location)

    selection_failed_then_success:
        # Brute force pattern: multiple 4625 followed by 4624
        EventID:
            - 4624
            - 4625

    filter_legitimate_service_accounts:
        # Exclude service accounts — these have predictable logon patterns
        # Add your environment's service account naming convention
        SubjectUserName|endswith:
            - '$'           # Machine accounts
            - '_svc'        # Service accounts (common naming)
            - '-svc'
        SubjectUserName|startswith:
            - 'svc-'
            - 'SVC-'

    filter_excluded_sources:
        # Exclude known legitimate management systems
        IpAddress:
            - '127.0.0.1'
            - '::1'
            - '-'           # Local logons have no IP

    # Impossible travel condition (implement as SIEM correlation):
    # Same SubjectUserName seen with two different IpAddress values
    # within a 10-minute window where both IPs are external/different subnets

    # Off-hours logon (implement as SIEM time-based filter):
    # TimeGenerated hour() not between 6 and 22

    condition: >
        selection_successful_logon
        and not filter_legitimate_service_accounts
        and not filter_excluded_sources

falsepositives:
    - VPN users connecting from different regions (impossible travel FP)
    - IT administrators with legitimate remote access from home
    - Shared service accounts used by multiple systems simultaneously
    - Global organisations with users genuinely working across time zones
    - Tune by: building per-account baseline of normal source IPs and hours

level: medium

# ── Correlation Logic for SIEM Deployment ─────────────────────────────────
#
# The highest-value detection from this rule requires correlation:
#
# Impossible Travel (implement in SIEM):
#   IF same SubjectUserName authenticates from IP_A and IP_B
#   within 10 minutes
#   AND IP_A and IP_B are in different /24 subnets
#   THEN alert: Impossible Travel — Valid Account Abuse
#
# Brute Force + Success (implement in SIEM):
#   IF SubjectUserName has >= 5 EventID 4625 (failures)
#   followed by EventID 4624 (success)
#   within 5 minutes
#   THEN alert: Credential Brute Force Succeeded
#
# Off-Hours Logon (implement as scheduled query):
#   Run during business hours, looking back at 22:00-06:00
#   Flag accounts not in approved off-hours access list
#
# MITRE ATT&CK Coverage:
#   T1078     — Valid Accounts (primary)
#   T1078.002 — Domain Accounts
#   T1078.003 — Local Accounts
#   T1110.001 — Brute Force: Password Guessing (secondary, brute+success)
#
# Companion rules:
#   rules/lateral_movement_rdp.yml        — RDP-specific lateral movement
#   rules/c2_beaconing_periodic.yml       — Post-access C2 detection
#   rules/tls_ja3_anomaly.yml             — Encrypted C2 channel detection
